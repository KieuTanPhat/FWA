databases:
  - name: fwa-demo-db
    plan: free
    region: singapore
    databaseName: fwa
    user: fwa

services:
  - type: web
    name: fwa-floodwatch-demo
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fwa-demo-db
          property: connectionString
      - key: MQTT_ENABLED
        value: "false"
      - key: DEMO_ONLY
        value: "true"
      - key: STALE_AFTER_SECONDS
        value: "15"
